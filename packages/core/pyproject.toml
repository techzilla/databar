[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "databar-core"
version = "0.1.0"
description = "databar format: frame layout, codes and stream packing shared by the encoder and decoder"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["databar.core*"]
namespaces = true
